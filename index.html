<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TraderScheme Workspace</title>
<style>
:root { --bg: #0b1426; --panel: #1a2942; --accent: #62a3ff; --text: #ffffff; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
#boot-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
.brain-logo { width: 200px; margin-bottom: 20px; }
#progress-bar { width: 300px; height: 6px; background: var(--panel); border-radius: 3px; }
#progress { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s; }
#main-ui { display: none; }
.nav-bar { background: var(--panel); padding: 15px; display: flex; justify-content: space-between; }
.tabs { display: flex; background: var(--bg); margin: 10px; border-radius: 8px; overflow: hidden; }
.tab { flex: 1; padding: 12px; text-align: center; background: var(--panel); cursor: pointer; }
.tab.active { background: var(--accent); }
.page { display: none; padding: 15px; }
.page.active { display: block; }
.card { background: var(--panel); padding: 20px; border-radius: 8px; margin: 10px; text-align: center; }
.error-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff4444; padding: 12px 20px; border-radius: 6px; display: none; z-index: 100; font-family: monospace; }
</style>
</head>
<body>

<div id="boot-screen">
    <img src="IMG-20260529-WA0025.jpg" class="brain-logo" onerror="this.style.display='none'">
    <div id="progress-bar"><div id="progress"></div></div>
</div>

<div id="main-ui">
    <div class="nav-bar">
        <div>TraderScheme Workspace</div>
        <div id="balance-display">--- USD</div>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="showPage('dashboard', this)">Dashboard</div>
        <div class="tab" onclick="showPage('bot', this)">Bot Builder</div>
        <div class="tab" onclick="showPage('manual', this)">Manual</div>
    </div>
    <div id="dashboard" class="page active">
        <div class="card">
            <h3>Live Volatility 100 Index</h3>
            <h1 id="price-display">Connecting...</h1>
        </div>
    </div>
    <div id="bot" class="page"><h2>Bot Configuration</h2></div>
    <div id="manual" class="page"><h2>Manual Trading</h2></div>
</div>

<div id="error-box" class="error-box"></div>

<script>
// === PUT YOUR DERIV CREDENTIALS HERE ===
const DERIV_APP_ID = "33egwMbRPIkA8tEiGipbD"; 
const DERIV_API_TOKEN = "pat_d32c84bf7f345e9b2c004b5b8e24b4f7ec68b4273ff52b80c1c576ea04098b71"; // Revoke old one and make new at app.deriv.com/account/api-token

let ws;
let isAuthorized = false;

function showError(msg) {
    const box = document.getElementById('error-box');
    box.innerText = msg;
    box.style.display = 'block';
    setTimeout(() => box.style.display = 'none', 5000);
    console.error(msg);
}
function handleWebSocketMessage(msg) {
    const res = JSON.parse(msg.data);
    console.log("WS:", res);

    if (res.error) {
        showError("Deriv Error: " + res.error.message);
        document.getElementById('price-display').innerText = "Auth Failed";
        return;
    }

    if (res.msg_type === 'authorize') {
        isAuthorized = true;
        startBoot();
    }

    if (res.msg_type === 'balance') {
        // FIXED: closed string, proper concatenation, correct Deriv balance object
        document.getElementById('balance-display').innerText = res.balance + " + res.balance.currency;
    }

    if (res.msg_type === 'tick') {
        document.getElementById('price-display').innerText = res.tick.quote;
    }
    }


function connectToDeriv() {
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${DERIV_APP_ID}`);
    
    ws.onopen = () => {
        ws.send(JSON.stringify({ authorize: DERIV_API_TOKEN }));
    };
    
    ws.onmessage = handleWebSocketMessage;
    
    ws.onerror = (e) => showError("WebSocket error: " + e.message);
    
    ws.onclose = () => {
        isAuthorized = false;
        document.getElementById('price-display').innerText = "Disconnected";
    };
}

function startBoot() {
    let p = 0;
    const interval = setInterval(() => {
        p += 2;
        document.getElementById('progress').style.width = p + "%";
        if (p >= 100) {
            clearInterval(interval);
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                ws.send(JSON.stringify({ ticks: "R_100", subscribe: 1 }));
            }
        }
    }, 50);
}

function showPage(id, tab) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    tab.classList.add('active');
}

window.addEventListener('load', connectToDeriv);
</script>
</body>
    </html>
