<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderScheme Workspace</title>
    <style>
        :root { --bg: #0b1426; --panel: #1a2942; --accent: #62a3ff; --text: #ffffff; --danger: #e74c3c; --success: #2ecc71; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* Boot Screen */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1426; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #progress-bar { width: 300px; height: 8px; background: #1a2942; border-radius: 4px; margin-top: 20px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s; }

        /* Dashboard */
        .container { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        .grid-main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .card { background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: var(--accent); font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid #334e68; padding-bottom: 10px; }
        
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334e68; background: var(--bg); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; background: var(--accent); border: none; border-radius: 6px; color: white; font-weight: bold; }
        button.stop { background: var(--danger); }

        #live-logs { background: #000; height: 250px; overflow-y: scroll; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334e68; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div style="font-size: 50px;">🧠</div>
        <h3>TraderScheme Initializing...</h3>
        <div id="progress-bar"><div id="progress"></div></div>
    </div>

    <div class="container" id="dashboard">
        <div class="grid-main">
            <div>
                <div class="card">
                    <h2>Bot Settings</h2>
                    <label>Strategy</label>
                    <select><option>Martingale</option><option>D'Alembert</option></select>
                    <label>Stake Amount</label> <input type="number" value="0.35">
                    <label>Stop Loss (USD)</label> <input type="number" value="10.00">
                    <label>Take Profit (USD)</label> <input type="number" value="5.00">
                    <button onclick="log('Bot Started')">START BOT</button>
                    <button class="stop" onclick="log('Bot Stopped')">STOP BOT</button>
                </div>
                <div class="card">
                    <h2>Balance</h2>
                    <div style="text-align: center; font-size: 1.5rem;" id="balance">0.00 USD</div>
                </div>
            </div>

            <div>
                <div class="card">
                    <h2>Live Signal Monitor</h2>
                    <div id="live-logs">System ready...</div>
                </div>
                <div class="card">
                    <h2>Trade History</h2>
                    <table>
                        <thead><tr><th>ID</th><th>Type</th><th>Result</th><th>Profit</th></tr></thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Boot Animation
        let p = 0;
        const interval = setInterval(() => {
            p += 2;
            document.getElementById('progress').style.width = p + "%";
            if (p >= 100) {
                clearInterval(interval);
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            }
        }, 50);

        // Logging & History
        function log(msg) {
            const logs = document.getElementById('live-logs');
            logs.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        // Simulate activity
        setInterval(() => {
            if(document.getElementById('dashboard').style.display === 'block' && Math.random() > 0.8) {
                log("Trade signal: CALL | Result: WIN | Profit: +0.30");
                const tbody = document.getElementById('history-body');
                tbody.innerHTML = `<tr><td>${Math.floor(Math.random()*999)}</td><td>CALL</td><td style="color:var(--success)">WIN</td><td>+0.30</td></tr>` + tbody.innerHTML;
            }
        }, 5000);
    </script>
</body>
</html>
