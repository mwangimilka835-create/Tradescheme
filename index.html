<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderWin Workspace</title>
    <style>
        :root { --bg: #0b1426; --panel: #1a2942; --accent: #62a3ff; --text: #ffffff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* Boot Screen */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .brain-logo { width: 250px; margin-bottom: 20px; }
        #progress-bar { width: 300px; height: 6px; background: var(--panel); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s; }

        /* Main UI */
        #main-ui { display: none; }
        .nav-bar { background: var(--panel); display: flex; justify-content: space-between; padding: 15px; align-items: center; }
        .tabs { display: flex; background: var(--bg); margin: 10px; border-radius: 8px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; text-align: center; background: var(--panel); cursor: pointer; font-weight: bold; }
        .tab.active { background: var(--accent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: var(--panel); padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; }
        .signal-card { background: var(--panel); margin: 15px; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

    <div id="boot-screen">
        <img src="IMG-20260529-WA0025.jpg" class="brain-logo" alt="TraderWin Brain">
        <div id="status-text">Initializing D-Bot...</div>
        <div id="progress-bar"><div id="progress"></div></div>
        <div id="percent">Boot sequence 0%</div>
    </div>

    <div id="main-ui">
        <div class="nav-bar">
            <div>☰ TraderWin Workspace</div>
            <div>6,790.80 USD <button>Demo</button></div>
        </div>
        <div class="tabs">
            <div class="tab active">Dashboard</div>
            <div class="tab">Bot Builder</div>
            <div class="tab">Manual Trader</div>
        </div>
        <div class="grid">
            <div class="card">📁 LOAD BOT</div>
            <div class="card">📊 ANALYSIS</div>
            <div class="card">🚀 SPEED BOT</div>
            <div class="card">💻 MANUAL TRADING</div>
        </div>
        <div style="padding: 15px; font-weight: bold;">LIVE TRADING SIGNALS</div>
        <div class="signal-card">
            <div>#1 Volatility 100 (1s) Index</div>
            <div style="font-size: 20px; color: var(--accent);">ODD 56.7%</div>
            <button style="width: 100%; margin-top: 10px; background: #e74c3c; border: none; padding: 10px; color: white;">Load Odd Signal</button>
        </div>
    </div>

    <script>
        let p = 0;
        const progress = document.getElementById('progress');
        const percent = document.getElementById('percent');
        const status = document.getElementById('status-text');
        
        const interval = setInterval(() => {
            p += 2;
            progress.style.width = p + "%";
            percent.innerText = "Boot sequence " + p + "%";
            if (p == 50) status.innerText = "Initializing your account...";
            if (p >= 100) {
                clearInterval(interval);
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }
        }, 50);
    </script>
</body>
                </html>
