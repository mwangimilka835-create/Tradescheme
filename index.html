<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TraderScheme Login</title>
    <style>
        :root { --bg: #0b1426; --panel: #1a2942; --accent: #62a3ff; --text: #ffffff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Login Box */
        #login-box { background: var(--panel); padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--accent); border: none; color: white; cursor: pointer; border-radius: 5px; margin-top: 5px; }
        
        /* Hidden UI Sections */
        #boot-screen, #main-ui { display: none; }
        
        /* (Keep your previous CSS for #main-ui and #boot-screen here) */
    </style>
</head>
<body>

    <div id="login-box">
        <h2>TraderScheme</h2>
        <input type="text" id="app-id-input" placeholder="Enter App ID">
        <input type="password" id="token-input" placeholder="Enter API Token">
        <button onclick="attemptLogin()">LOGIN</button>
        <p style="font-size: 12px; margin-top: 15px;">New? <a href="https://developers.deriv.com/" target="_blank" style="color: var(--accent);">Sign Up for Deriv API</a></p>
    </div>

    <div id="boot-screen">...</div>

    <div id="main-ui">...</div>

    <script>
        function attemptLogin() {
            const appId = document.getElementById('app-id-input').value;
            const token = document.getElementById('token-input').value;

            // Simple validation check
            if(!appId || !token) return alert("Please enter both ID and Token");

            const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ authorize: token }));
            };

            ws.onmessage = (msg) => {
                const res = JSON.parse(msg.data);
                if (res.error) {
                    alert("Login Failed: " + res.error.message);
                    ws.close();
                } else if (res.authorize) {
                    // Success! Hide login, show boot
                    document.getElementById('login-box').style.display = 'none';
                    startBootSequence();
                }
            };
        }

        function startBootSequence() {
            document.getElementById('boot-screen').style.display = 'flex';
            // ... (Add your existing interval/progress bar code here)
        }
    </script>
</body>
</html>
