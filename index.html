<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderScheme Workspace</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0b1426; color: white; height: 100vh; overflow: hidden; }

        /* Loading Screen */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1426; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .brain-icon { font-size: 80px; margin-bottom: 20px; }
        #progress-bar { width: 80%; height: 8px; background: #1a2942; border-radius: 4px; margin-top: 20px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #62a3ff; transition: width 0.1s; }

        /* Main Dashboard */
        .container { padding: 20px; display: none; }
        .card { background: #1a2942; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 8px; background: #62a3ff; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="brain-icon">🧠</div>
        <h3>TraderScheme Trading Workspace</h3>
        <p>Initializing D-Bot...</p>
        <div id="progress-bar"><div id="progress"></div></div>
        <p style="margin-top:10px">Boot sequence <span id="percent">0</span>%</p>
    </div>

    <div class="container" id="dashboard">
        <h1>Dashboard</h1>
        <div class="card">
            <p>Welcome back, Trader.</p>
            <div class="btn-group">
                <button>LOAD BOT</button>
                <button>MANUAL TRADING</button>
                <button>SPEED BOT</button>
                <button>ANALYSIS TOOL</button>
            </div>
        </div>
    </div>

    <script>
        // Boot Sequence Simulation
        let p = 0;
        const progress = document.getElementById('progress');
        const percent = document.getElementById('percent');
        const interval = setInterval(() => {
            p += 2;
            progress.style.width = p + "%";
            percent.innerText = p;
            if (p >= 100) {
                clearInterval(interval);
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            }
        }, 50);
    </script>
</body>
</html>
