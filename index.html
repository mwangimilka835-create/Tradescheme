<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #0b1426; color: #ffffff; }
        #app { max-width: 600px; margin: auto; background: #1a2942; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #62a3ff; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #334e68; background: #0b1426; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; cursor: pointer; background: #62a3ff; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 16px; }
        button:hover { background: #4a8ad9; }
        #status { margin-top: 15px; text-align: center; color: #8899a6; }
        #balance { margin-top: 10px; font-size: 1.2em; text-align: center; color: #2ecc71; }
    </style>
</head>
<body>
    <div id="app">
        <h1>Deriv Trading Dashboard</h1>
        <input type="password" id="apiToken" placeholder="Enter your Deriv API Token">
        <button onclick="connectToDeriv()">Connect to Deriv</button>
        <div id="status">Status: Disconnected</div>
        <div id="balance">Balance: --</div>
    </div>

    <script>
        let connection;

        function connectToDeriv() {
            const token = document.getElementById('apiToken').value;
            const appId = '1089'; // Use your own App ID from Deriv
            const url = `wss://ws.derivws.com/websockets/v3?app_id=${appId}`;

            if (!token) {
                alert("Please enter your API token.");
                return;
            }

            connection = new WebSocket(url);

            connection.onopen = () => {
                document.getElementById('status').innerText = "Status: Connecting...";
                connection.send(JSON.stringify({ authorize: token }));
            };

            connection.onmessage = (msg) => {
                const response = JSON.parse(msg.data);
                
                if (response.error) {
                    alert("Error: " + response.error.message);
                    document.getElementById('status').innerText = "Status: Error";
                    return;
                }

                if (response.authorize) {
                    document.getElementById('status').innerText = "Status: Connected";
                    connection.send(JSON.stringify({ balance: 1 }));
                }
                
                if (response.balance) {
                    document.getElementById('balance').innerText = 
                        `Balance: ${response.balance.balance} ${response.balance.currency}`;
                }
            };

            connection.onerror = (err) => {
                document.getElementById('status').innerText = "Status: Connection Failed";
            };
            
            connection.onclose = () => {
                document.getElementById('status').innerText = "Status: Disconnected";
            };
        }
    </script>
</body>
</html>
