<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderScheme Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-[#020617] text-slate-200">
<div id="app" class="max-w-md mx-auto min-h-screen border-x border-slate-800">
    <header class="p-4 flex justify-between items-center bg-[#0f172a] border-b border-slate-800">
        <h1 class="font-bold text-lg">TraderScheme</h1>
        <div class="bg-slate-900 px-2 py-1 rounded text-xs font-bold text-emerald-400">
            {{ balance }} USD <span class="text-slate-500">Demo</span>
        </div>
    </header>

    <nav class="flex overflow-x-auto p-2 gap-2 bg-[#0f172a] text-xs font-bold">
        <button @click="activeTab = 'Dashboard'" :class="{'text-white border-b-2 border-amber-500': activeTab === 'Dashboard'}">Dashboard</button>
        <button @click="activeTab = 'BotBuilder'" :class="{'text-white border-b-2 border-amber-500': activeTab === 'BotBuilder'}">Bot Builder</button>
        <button @click="activeTab = 'Manual'" :class="{'text-white border-b-2 border-amber-500': activeTab === 'Manual'}">Manual Trader</button>
    </nav>

    <main class="p-4">
        <div v-if="activeTab === 'Dashboard'">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-800 text-center">Load Bot</div>
                <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-800 text-center">Analysis Tool</div>
            </div>
            <div class="mt-6 bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                <h2 class="text-sm font-bold mb-4">Live Trading Signals</h2>
                <div v-for="signal in signals" :key="signal.id" class="p-3 bg-slate-900 rounded mb-2">
                    <p class="font-bold text-amber-500">{{ signal.asset }}</p>
                    <p class="text-xs">Confidence: {{ signal.confidence }}%</p>
                </div>
            </div>
        </div>

        <div v-else class="text-center mt-20 text-slate-500">
            {{ activeTab }} Module Loading...
        </div>
    </main>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;
    createApp({
        setup() {
            const activeTab = ref('Dashboard');
            const balance = ref('6,790.80');
            const signals = ref([
                { id: 1, asset: 'Volatility 100 (1s) Index', confidence: 56.7 },
                { id: 2, asset: 'Volatility 50 Index', confidence: 57.5 }
            ]);

            // Deriv WebSocket Connection Placeholder
            const connectDeriv = () => {
                const ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
                ws.onopen = () => console.log("Handshake established");
                ws.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    // Handle API ticks/signals here
                };
            };

            onMounted(connectDeriv);
            return { activeTab, balance, signals };
        }
    }).mount('#app');
</script>
</body>
</html>
