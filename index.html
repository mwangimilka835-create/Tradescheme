<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TraderWin Demo Workspace</title>
    <style>
        :root { --bg: #0b1426; --panel: #1a2942; --accent: #62a3ff; --text: #ffffff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }

        /* Boot Screen */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .brain-logo { width: 200px; margin-bottom: 20px; }
        #progress-bar { width: 300px; height: 6px; background: var(--panel); border-radius: 3px; margin: 20px 0; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--accent); }

        /* UI */
        #main-ui { display: none; }
        .nav-bar { background: var(--panel); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; background: var(--bg); margin: 10px; border-radius: 8px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; text-align: center; background: var(--panel); cursor: pointer; }
        .tab.active { background: var(--accent); }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .card { background: var(--panel); padding: 20px; border-radius: 8px; margin: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <img src="IMG-20260529-WA0025.jpg" class="brain-logo">
        <div id="progress-bar"><div id="progress"></div></div>
    </div>

    <div id="main-ui">
        <div class="nav-bar">
            <div>TraderWin Workspace</div>
            <div id="balance-display">Loading...</div>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="showPage('dashboard', this)">Dashboard</div>
            <div class="tab" onclick="showPage('bot-builder', this)">Bot Builder</div>
            <div class="tab" onclick="showPage('manual', this)">Manual Trader</div>
        </div>

        <div id="dashboard" class="page active">
            <div class="card" id="signal-box">
                <h3>Live Volatility 100 Index</h3>
                <h1 id="price-display">---</h1>
            </div>
        </div>
        <div id="bot-builder" class="page"><h2>Bot Builder Configuration</h2></div>
        <div id="manual" class="page"><h2>Manual Trader Mode</h2></div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL VALUES FOR TESTING
        const APP_ID = '1089'; 
        const API_TOKEN = 'pat_074035b32dd29b413024ae73c1a07dc91242831bf045516b897db5d6362799cb';

        // 1. Boot Animation
        let p = 0;
        const interval = setInterval(() => {
            p += 2;
            document.getElementById('progress').style.width = p + "%";
            if (p >= 100) {
                clearInterval(interval);
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                connectDeriv(); // Start connection after boot
            }
        }, 50);

        // 2. Connection Logic
        function connectDeriv() {
            const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
            ws.onopen = () => ws.send(JSON.stringify({ authorize: API_TOKEN }));
            ws.onmessage = (msg) => {
                const res = JSON.parse(msg.data);
                if (res.authorize) ws.send(JSON.stringify({ balance: 1, subscribe: 1, ticks: "R_100" }));
                if (res.balance) document.getElementById('balance-display').innerText = res.balance.balance + " USD";
                if (res.tick) document.getElementById('price-display').innerText = res.tick.quote;
            };
        }

        // 3. Tab Logic
        function showPage(id, tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tab.classList.add('active');
        }
    </script>
</body>
</html>
